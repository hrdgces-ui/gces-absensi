<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi PT. GCES V16.0 - PIN & Selfie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .shadow-card-soft { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
    .shadow-glow-emerald { box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
    @keyframes pulseRing { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.12); opacity: 0.2; } 100% { transform: scale(0.95); opacity: 0.8; } }
    .animate-pulse-ring { animation: pulseRing 3.5s infinite ease-in-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-[100dvh] max-w-md mx-auto relative overflow-hidden select-none">

<header class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-lg border-b border-slate-700 shrink-0">
  <div class="flex items-center space-x-3 w-full">
    <div class="w-16 h-16 rounded-xl bg-white flex items-center justify-center shadow-md overflow-hidden shrink-0 border border-slate-200">
      <img src="Logo%20GCES%20New.png" alt="Logo GCES" onerror="this.onerror=null; this.outerHTML='<div class=\'w-full h-full flex items-center justify-center font-black text-slate-800 text-[18px] tracking-tighter bg-white\'>GCES</div>'" class="w-full h-full object-contain p-1.5">
    </div>
    <div class="flex flex-col justify-center py-1">
      <h1 class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-0.5">Absensi Operasional</h1>
      <div class="flex items-center gap-2">
        <h2 class="text-[22px] font-black tracking-widest uppercase text-white leading-none">PT. GCES</h2>
        <p class="text-[9px] text-amber-400 font-bold bg-amber-900/60 px-1.5 py-0.5 rounded-md border border-amber-700/50 leading-none"><i class="fa-solid fa-lock text-[8px]"></i> V16.0</p>
      </div>
    </div>
  </div>
  <div class="flex items-center shrink-0 ml-2">
    <button onclick="toggleUserDropdown()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition shadow-md max-w-[110px]">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
      <span class="text-[11px] truncate w-full text-left" id="headerActiveUserShort">Pilih Akun</span>
      <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 shrink-0"></i>
    </button>
  </div>
</header>

<!-- PENCARIAN AKUN -->
<div id="userDropdownCard" class="hidden absolute top-20 left-4 right-4 z-40 bg-white border border-slate-200 rounded-2xl shadow-2xl p-5 flex flex-col max-h-[75vh]">
  <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-3 shrink-0">
    <div>
      <span class="text-sm font-bold text-slate-800 block">Identitas Karyawan</span>
      <span class="text-[10px] text-slate-500">Pilih nama untuk Login</span>
    </div>
    <button onclick="toggleUserDropdown()" class="text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 w-8 h-8 rounded-full flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="mb-3 relative shrink-0">
    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
    <input type="text" id="userSearchInput" oninput="filterUserDropdown(this.value)" placeholder="Cari nama, NIP..." class="w-full text-xs border border-emerald-500 rounded-xl pl-9 pr-3 py-3 bg-white outline-none focus:ring-2 focus:ring-emerald-500 transition shadow-sm font-medium" />
  </div>
  <div class="overflow-y-auto space-y-2 text-xs pb-1 pr-1" id="userListContainer"></div>
</div>

<!-- MODAL PIN RAHASIA -->
<div id="pinModal" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-[280px] text-center relative transform transition-all scale-100">
    <button onclick="closePinModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
    <div class="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3">
       <i class="fa-solid fa-shield-halved text-2xl text-amber-500"></i>
    </div>
    <h3 class="text-sm font-black text-slate-800 uppercase tracking-wide">Masukkan PIN</h3>
    <p class="text-[10px] text-slate-500 mt-1 mb-4" id="pinNameTarget">Akun: -</p>
    <input type="password" id="pinInput" placeholder="••••" maxlength="6" inputmode="numeric" class="w-full text-center text-2xl tracking-widest font-black border-2 border-slate-200 rounded-xl py-3 outline-none focus:border-amber-500 bg-slate-50 transition shadow-inner">
    <button onclick="verifyPin()" class="w-full mt-4 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow-lg transition active:scale-95 text-xs uppercase tracking-wider">Verifikasi</button>
  </div>
</div>

<main class="flex-1 overflow-y-auto p-4 space-y-4">
  <!-- BERANDA -->
  <div id="tabContent-beranda" class="space-y-4 tab-content-pane">
    <div id="gpsStatusCard" class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 flex items-center justify-between shadow-card-soft transition-all">
      <div class="flex items-center space-x-3">
        <div id="gpsIconBg" class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-lg shadow-sm"><i class="fa-solid fa-location-crosshairs"></i></div>
        <div>
          <div class="flex items-center space-x-1.5">
            <span id="gpsDotIndicator" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
            <span id="gpsStatusTitle" class="text-xs font-bold text-emerald-900">MENUNGGU LOKASI...</span>
          </div>
          <p id="gpsStatusDesc" class="text-[11px] text-emerald-700 font-medium">Jarak: <span id="gpsDistanceText" class="font-bold">Mencari satelit...</span></p>
        </div>
      </div>
    </div>

    <!-- Pilihan Shift -->
    <div id="shiftSelectorBox" class="bg-white border border-slate-200 rounded-2xl p-3 shadow-card-soft space-y-2">
      <span class="text-xs font-bold text-slate-800 flex items-center"><i class="fa-solid fa-clock-rotate-left text-emerald-600 mr-1.5"></i> Pilih Shift:</span>
      <div class="flex gap-1.5" id="shiftButtonsContainer">
        <button onclick="selectShift('1')" id="btnShift1" class="flex-1 border border-emerald-500 bg-emerald-50 text-emerald-700 py-1.5 rounded-lg text-[10px] font-bold">Shift 1</button>
        <button onclick="selectShift('2')" id="btnShift2" class="flex-1 border border-slate-200 bg-slate-50 text-slate-500 py-1.5 rounded-lg text-[10px] font-bold">Shift 2</button>
        <button onclick="selectShift('3')" id="btnShift3" class="flex-1 border border-slate-200 bg-slate-50 text-slate-500 py-1.5 rounded-lg text-[10px] font-bold">Shift 3</button>
        <button onclick="selectShift('Middle')" id="btnShiftMiddle" class="hidden flex-1 border border-slate-200 bg-slate-50 text-slate-500 py-1.5 rounded-lg text-[10px] font-bold">Middle</button>
      </div>
    </div>

    <!-- Area Absen -->
    <div class="py-4 flex flex-col items-center justify-center space-y-4">
      <div class="flex bg-slate-200/70 p-1.5 rounded-xl w-60 z-10 relative shadow-inner">
        <button onclick="setJenisAbsen('masuk')" id="btnJenisMasuk" class="flex-1 text-[11px] font-bold py-2 rounded-lg bg-white text-emerald-600 shadow-sm transition">MASUK</button>
        <button onclick="setJenisAbsen('pulang')" id="btnJenisPulang" class="flex-1 text-[11px] font-bold py-2 rounded-lg text-slate-500 hover:text-slate-700 transition cursor-pointer">PULANG</button>
      </div>
      <div class="relative flex items-center justify-center mt-2">
        <div id="btnGlowRing" class="absolute w-44 h-44 rounded-full bg-emerald-500/20 animate-pulse-ring"></div>
        <button id="mainAbsenBtn" onclick="triggerAbsenAction()" class="relative z-10 w-36 h-36 rounded-full bg-slate-300 text-slate-500 flex flex-col items-center justify-center border-4 border-slate-200 cursor-not-allowed transition duration-200 group">
          <i id="mainAbsenIcon" class="fa-solid fa-fingerprint text-4xl mb-1 group-hover:scale-110 transition"></i>
          <span id="mainAbsenLabel" class="text-xs font-black uppercase tracking-wider">TAP ABSEN</span>
          <span id="mainAbsenSublabel" class="hidden text-[9px] text-emerald-100 font-bold mt-0.5 bg-black/20 px-2 py-0.5 rounded-full">MASUK SHIFT 1</span>
        </button>
      </div>
    </div>
  </div>
  
  <!-- SISA PANE LAINNYA (CUTI, TIM, ADMIN, RIWAYAT) -->
  <div id="tabContent-cuti" class="tab-content-pane hidden"></div>
  <div id="tabContent-tim" class="tab-content-pane hidden"></div>
  <div id="tabContent-admin" class="tab-content-pane hidden"></div>
  <div id="tabContent-riwayat" class="tab-content-pane hidden"></div>
</main>

<nav class="bg-white border-t border-slate-200 px-6 py-2 pb-safe flex justify-between items-center shrink-0 w-full z-30 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
  <button onclick="switchTab('beranda')" id="nav-beranda" class="flex flex-col items-center space-y-1 p-2 text-emerald-600 transition nav-btn"><i class="fa-solid fa-fingerprint text-xl"></i><span class="text-[9px] font-bold">Absen</span></button>
  <button onclick="switchTab('riwayat')" id="nav-riwayat" class="flex flex-col items-center space-y-1 p-2 text-slate-400 transition nav-btn"><i class="fa-solid fa-clock-rotate-left text-xl"></i><span class="text-[9px] font-bold">Riwayat</span></button>
  <button onclick="switchTab('cuti')" id="nav-cuti" class="flex flex-col items-center space-y-1 p-2 text-slate-400 transition nav-btn"><i class="fa-solid fa-calendar-days text-xl"></i><span class="text-[9px] font-bold">Cuti</span></button>
</nav>

<!-- TOAST -->
<div id="toastNotification" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2.5 rounded-xl shadow-xl flex items-center space-x-3 transition-all duration-300 opacity-0 pointer-events-none z-50 text-xs font-medium border border-slate-700 w-11/12 max-w-[350px]">
  <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i><span id="toastMessage">Pesan Notifikasi</span>
</div>

<!-- KAMERA MODAL (SELFIE) -->
<div id="cameraModal" class="hidden fixed inset-0 z-50 bg-slate-900/95 backdrop-blur-sm flex flex-col items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl flex flex-col transform transition-all">
    <div class="p-4 bg-slate-900 text-white flex justify-between items-center"><div class="flex items-center space-x-2"><i class="fa-solid fa-camera-rotate text-emerald-400"></i><h3 class="text-sm font-bold tracking-wide">Wajib Bukti Selfie</h3></div><button onclick="closeCamera()" class="text-slate-400 bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark text-sm"></i></button></div>
    <div class="relative bg-black aspect-[3/4] w-full flex items-center justify-center overflow-hidden">
      <video id="cameraVideo" class="w-full h-full object-cover transform scale-x-[-1]" playsinline autoplay></video>
      <div class="absolute inset-0 border-[6px] border-black/20 z-10 pointer-events-none"></div>
      <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-48 h-64 border-2 border-dashed border-white/70 rounded-[100px] z-10 shadow-[0_0_0_999px_rgba(0,0,0,0.5)] pointer-events-none"></div>
      <div id="cameraLoading" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-slate-900 z-0"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-emerald-500"></i><p class="text-xs">Menyiapkan Kamera...</p></div>
    </div>
    <div class="p-5 bg-white flex flex-col items-center relative">
        <p class="text-[10px] text-slate-500 mb-2 font-medium">Posisikan wajah Anda di dalam garis putus-putus</p>
        <button onclick="captureAndSubmit()" class="w-16 h-16 rounded-full bg-emerald-500 hover:bg-emerald-600 border-4 border-emerald-100 shadow-glow-emerald flex items-center justify-center text-white transition-transform active:scale-95"><i class="fa-solid fa-camera text-2xl"></i></button>
    </div>
  </div>
</div>

<script>
  // --- DATABASE TITIK KOORDINAT ---
  const LOKASI_KOORDINAT = {
    "RS. HARUM SISMA MEDIKA": { lat: -6.262573, lng: 106.897818 },
    "RS. SUKMUL SISMA MEDIKA": { lat: -6.115859, lng: 106.892784 }
    // ... (Tambahkan kembali koordinat PT dan Klinik Bapak di sini) ...
  };

  // --- DATABASE KARYAWAN ---
  const OFFICIAL_EXCEL_EMPLOYEES = [
    { nip: "NEW 01", nama: "Makhdum Dzati", email: "makhdumdzati03@gmail.com", jabatan: "CSO", lokasi: "RS. SUKMUL SISMA MEDIKA", pin: "1234" },
    { nip: "01.012.01.19", nama: "SYAULIA MEDY DAIYAH", email: "syauliadaiyah@gmail.com", jabatan: "SPV", lokasi: "RS. HARUM SISMA MEDIKA", pin: "1234" },
    { nip: "01.047.04.21", nama: "MUCHAMAD UBAY DILLAH", email: "dubay041103@gmail.com", jabatan: "LEADER", lokasi: "RS. HARUM SISMA MEDIKA", pin: "1234" },
    { nip: "01.135.05.25", nama: "Desta Pratama", email: "bagasdwisetiawan05@gmail.com", jabatan: "CSO", lokasi: "RS. HARUM SISMA MEDIKA", pin: "1234" }
    // ... (Tambahkan seluruh daftar karyawan di sini. Pastikan semuanya ditambah tulisan , pin: "1234" di ujungnya) ...
  ];

  let employees = [...OFFICIAL_EXCEL_EMPLOYEES];
  let currentUser = null;
  let selectedNipForLogin = null;
  let currentShift = "1";
  let currentGpsDistance = 9999; 
  let maxDistance = 1000;
  let isNonShift = false;
  let cameraStream = null;
  let jenisAbsen = "masuk"; 

  window.onload = () => {
    renderUserDropdown();
    const savedUser = localStorage.getItem('gces_currentUser');
    if(savedUser) { let userObj = JSON.parse(savedUser); if(userObj && userObj.nip) { const isValid = employees.find(e => e.nip === userObj.nip); if(isValid) setUser(userObj); } }
  };

  function showToast(msg, isErr = false) {
    const toast = document.getElementById('toastNotification');
    document.getElementById('toastMessage').textContent = msg;
    document.getElementById('toastIcon').className = isErr ? 'fa-solid fa-circle-exclamation text-red-400 text-lg' : 'fa-solid fa-circle-check text-emerald-400 text-lg';
    toast.className = isErr ? toast.className.replace('bg-slate-800', 'bg-red-900').replace('border-slate-700', 'border-red-700') : toast.className.replace('bg-red-900', 'bg-slate-800').replace('border-red-700', 'border-slate-700');
    toast.classList.remove('opacity-0');
    setTimeout(() => { toast.classList.add('opacity-0'); }, 4000);
  }

  // LOGIKA PIN LOGIN
  function toggleUserDropdown() { document.getElementById('userDropdownCard').classList.toggle('hidden'); }
  function formatInitials(name) { return (name || "ID").split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase(); }
  
  function renderUserDropdown(filter = '') {
    const container = document.getElementById('userListContainer'); container.innerHTML = '';
    let filtered = filter ? employees.filter(e => e.nama.toLowerCase().includes(filter.toLowerCase()) || e.nip.toLowerCase().includes(filter.toLowerCase())) : employees;
    filtered.forEach(emp => {
        container.insertAdjacentHTML('beforeend', `<div onclick="initiateLogin('${emp.nip}', '${emp.nama}')" class="p-3 rounded-2xl border bg-white border-slate-100 hover:bg-slate-50 transition cursor-pointer flex items-center justify-between mb-2"><div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-[12px]">${formatInitials(emp.nama)}</div><div><h4 class="font-bold text-[12px]">${emp.nama}</h4><p class="text-[10px]"><span class="font-bold text-emerald-600"><i class="fa-solid fa-lock text-[8px]"></i> Butuh PIN</span> &bull; ${emp.lokasi}</p></div></div></div>`);
    });
  }
  function filterUserDropdown(val) { renderUserDropdown(val); }

  function initiateLogin(nip, nama) {
      selectedNipForLogin = nip;
      document.getElementById('pinNameTarget').textContent = "Akun: " + nama;
      document.getElementById('pinInput').value = '';
      document.getElementById('userDropdownCard').classList.add('hidden');
      document.getElementById('pinModal').classList.remove('hidden');
  }
  function closePinModal() { document.getElementById('pinModal').classList.add('hidden'); }
  
  function verifyPin() {
      const pin = document.getElementById('pinInput').value;
      const user = employees.find(e => e.nip === selectedNipForLogin);
      if(user.pin === pin) {
          closePinModal();
          setUser(user);
          showToast(`Berhasil login: ${user.nama}`);
      } else {
          showToast("PIN SALAH!", true);
          document.getElementById('pinInput').value = '';
      }
  }

  function setUser(user) {
      currentUser = user; localStorage.setItem('gces_currentUser', JSON.stringify(user));
      document.getElementById('headerActiveUserShort').textContent = user.nama.split(' ')[0].substring(0,9);
      
      isNonShift = ["PT. CELSIUS CREATIVA", "PT. MOYA INDONESIA", "PT. SAPTA WARNA CEMERLANG", "PT. MUTIARA HEXAGON", "PT. SM"].includes(user.lokasi) || user.lokasi.startsWith("PT.");
      if(isNonShift) { document.getElementById('shiftSelectorBox').classList.add('hidden'); currentShift = 'Non-Shift'; } 
      else { 
          document.getElementById('shiftSelectorBox').classList.remove('hidden');
          selectShift('1'); 
      }
      aktifkanGPSAsli(); // Panggil GPS (gunakan fungsi GPS yang sudah Bapak copy sebelumnya)
  }

  function setJenisAbsen(jenis) {
      jenisAbsen = jenis;
      document.getElementById('btnJenisMasuk').className = jenis === 'masuk' ? "flex-1 text-[11px] font-bold py-2 rounded-lg bg-white text-emerald-600 shadow-sm transition" : "flex-1 text-[11px] font-bold py-2 rounded-lg text-slate-500 hover:text-slate-700 transition cursor-pointer";
      document.getElementById('btnJenisPulang').className = jenis === 'pulang' ? "flex-1 text-[11px] font-bold py-2 rounded-lg bg-white text-rose-600 shadow-sm transition" : "flex-1 text-[11px] font-bold py-2 rounded-lg text-slate-500 hover:text-slate-700 transition cursor-pointer";
      document.getElementById('mainAbsenSublabel').textContent = `${jenisAbsen.toUpperCase()} ${isNonShift ? "NON-SHIFT" : `SHIFT ${currentShift}`}`;
      document.getElementById('mainAbsenSublabel').classList.remove('hidden');
  }
  function selectShift(numStr) { currentShift = numStr; setJenisAbsen(jenisAbsen); }

  async function triggerAbsenAction() {
      if(!currentUser) { showToast("Pilih Akun dulu!", true); return; }
      // (Untuk testing, jika GPS belum dikunci, hapus/komen baris di bawah ini dulu)
      // if(currentGpsDistance > maxDistance) { showToast("Di luar radius!", true); return; }
      
      document.getElementById('cameraModal').classList.remove('hidden');
      document.getElementById('cameraLoading').style.display = 'flex';
      try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
          const videoEl = document.getElementById('cameraVideo');
          videoEl.srcObject = cameraStream;
          videoEl.onloadedmetadata = () => { videoEl.play(); document.getElementById('cameraLoading').style.display = 'none'; };
      } catch (err) { document.getElementById('cameraLoading').innerHTML = `<p class="text-red-500 text-center font-bold">Gagal akses kamera</p>`; }
  }

  function closeCamera() { document.getElementById('cameraModal').classList.add('hidden'); if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; } }

  // LOGIKA MENJEPRET DAN MENGUBAH FOTO MENJADI DATA
  function captureAndSubmit() {
      if(!cameraStream) return;
      
      const videoEl = document.getElementById('cameraVideo');
      const canvas = document.createElement('canvas');
      
      // Ukuran foto dikompres agar cepat terkirim (480px)
      const scale = 480 / videoEl.videoWidth;
      canvas.width = 480;
      canvas.height = videoEl.videoHeight * scale;
      const ctx = canvas.getContext('2d');
      // Membalikkan gambar agar tidak mirror
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      
      // Mengubah gambar menjadi Base64 (Format Text panjang)
      const selfieBase64Data = canvas.toDataURL('image/jpeg', 0.6); 
      
      closeCamera();
      showToast("Sedang Mengirim & Menyimpan Foto...");
      
      const payload = { 
          nip: currentUser.nip, nama: currentUser.nama, jabatan: currentUser.jabatan, 
          lokasi: currentUser.lokasi, shift: isNonShift ? "Non-Shift" : `Shift ${currentShift}`, 
          jenisAbsen: jenisAbsen,
          selfieBase64: selfieBase64Data // Foto dikirim ke Server
      };
      
      // LINK WEBHOOK GOOGLE SCRIPT
      fetch("https://script.google.com/macros/s/AKfycbyI0ZEi7rlUaJ_xpq4iqs1aaFfL5KGzSTJyJPanuwCUNnGAchmkVWxzjGzKFCd95ssQ7w/exec", {
          method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
      }).then(() => showToast(`Absen ${jenisAbsen.toUpperCase()} & Selfie Tersimpan!`))
        .catch(() => showToast("Gagal menyimpan ke server", true));
  }
  
  function switchTab(tabId) { /* fungsi switch tab tetap sama */ }
  function aktifkanGPSAsli() { /* fungsi GPS tetap sama */ }
</script>
</body>
</html>
