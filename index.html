<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Operasional PT GCES</title>
    <script>
        // URL Web App Google Script yang sudah langsung terpasang
        const webhookUrl = "https://script.google.com/macros/s/AKfycbzwEjmJuY2f_uzNNnotrudMU6OCiGMKPAFYAlQ9rS_kKnT9U-Ou8m2FSyrFL03Kca2avQ/exec";
        
        // Fungsi untuk mengirim data absensi
        async function triggerAbsenAction(dataAbsen) {
            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify(dataAbsen)
                });
                console.log("SUKSES: Data terkirim ke server");
            } catch (error) {
                console.error("GAGAL KARENA: " + error.message);
            }
        }
    </script>
</head>
<body>
    <h1>Sistem Absensi PT GCES</h1>
    <p>Silakan gunakan aplikasi absensi Anda seperti biasa.</p>
</body>
</html>
